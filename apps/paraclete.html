<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mecklenburg County Voter Guide</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap">
<style>
:root{--h:110;--dl:50%;--bg:hsl(var(--h) 18% 96%);--ink:hsl(var(--h) 30% 13%);--mute:hsl(var(--h) 12% 38%);--line:hsl(var(--h) 16% 87%);--acc:hsl(var(--h) 42% 32%);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--dl:62%;--bg:hsl(var(--h) 16% 9%);--ink:hsl(var(--h) 20% 92%);--mute:hsl(var(--h) 10% 64%);--line:hsl(var(--h) 12% 20%);--acc:hsl(var(--h) 45% 72%)}}
:root[data-theme="dark"]{--dl:62%;--bg:hsl(var(--h) 16% 9%);--ink:hsl(var(--h) 20% 92%);--mute:hsl(var(--h) 10% 64%);--line:hsl(var(--h) 12% 20%);--acc:hsl(var(--h) 45% 72%)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.65 Figtree,system-ui,-apple-system,sans-serif;transition:background-color .6s ease,color .6s ease;-webkit-text-size-adjust:100%}
main{max-width:520px;margin:0 auto;padding:72px 28px 96px}
a{color:inherit;text-decoration:none}
h1,h2,h3,.nm{font-family:'Instrument Serif',Georgia,serif;font-weight:400;margin:0}
h1{font-size:clamp(2.6rem,12vw,3.6rem);line-height:1;letter-spacing:-.01em}
h2{font-size:clamp(2.3rem,10vw,3rem);line-height:1.04}
.lede{color:var(--mute);margin:20px 0 0;max-width:34ch}
.nav{margin-top:80px;display:grid;gap:38px}
.row{display:flex;gap:18px;align-items:flex-start}
.row:active{opacity:.55}
.dot{width:11px;height:11px;border-radius:50%;background:hsl(var(--h) 40% var(--dl));flex:none;margin-top:11px}
.row .nm{font-size:1.9rem;line-height:1.1;display:block}
.row small{display:block;color:var(--mute);font-size:.9rem;margin-top:6px}
.foot{margin-top:96px;color:var(--mute);font-size:.85rem;max-width:34ch}
.back{display:inline-flex;align-items:center;gap:10px;color:var(--mute);font-size:.95rem;margin-bottom:56px}
.back:before{content:"";width:7px;height:7px;border-left:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg)}
.gp{margin-top:72px}
.gp h3{font-size:1.65rem;font-style:italic;line-height:1.15}
.gv{color:var(--mute);font-size:.9rem;margin:4px 0 22px}
.note{color:var(--mute);font-size:.95rem;margin:0 0 22px;max-width:40ch}
.it{border-top:1px solid var(--line)}
.it:last-child{border-bottom:1px solid var(--line)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;text-align:left;cursor:pointer}
.it>button{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;width:100%;padding:22px 0}
.it .nm{display:block;font-size:1.6rem;line-height:1.15}
.tg{display:block;color:var(--mute);font-size:.875rem;margin-top:5px}
.i{width:14px;height:14px;position:relative;flex:none;margin-top:10px}
.i:before,.i:after{content:"";position:absolute;left:0;top:6px;width:14px;height:1.5px;background:var(--mute);transition:transform .3s ease}
.i:after{transform:rotate(90deg)}
.open .i:after{transform:rotate(0)}
.pn{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
.open .pn{grid-template-rows:1fr}
.pn>div{overflow:hidden;visibility:hidden;transition:visibility .35s}
.open .pn>div{visibility:visible}
.pn p{margin:0 0 20px;padding-right:20px}
.pn b{display:block;font-weight:500;color:var(--acc);font-size:.85rem;margin-bottom:3px}
.next{display:block;margin-top:88px;color:var(--mute);font-size:.9rem}
.next .nm{display:block;color:var(--ink);font-size:1.7rem;line-height:1.15;margin-top:4px}
a:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:4px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<script>
const L={b:'Background',a:'Actions',c:'Criticism',p:'Platform',y:'For a young middle-class married couple',f:'Philosophy',q:'The choice',u:'Vote for',n:'Vote against'};
const P=[
{id:'races',h:205,t:'Federal and state races',s:'Senate, House and state legislature',n:'Tap a name to see their record, criticism, platform and what it could mean for a young, middle-class married couple.',g:[
{t:'U.S. Senate',v:'Vote for 1',i:[
['Roy Cooper','Democrat',{b:'Two-term governor, former attorney general and state legislator, and the only one of the four with a trackable record of signed laws, votes and budgets. Expanded Medicaid in 2023 to over 600,000 residents, secured Toyota and VinFast plants, and signed a 70% utility carbon cut by 2030. In practice, the Medicaid expansion gave coverage to hundreds of thousands of working adults who had none, the plant deals were aimed at bringing factory jobs and supplier work to North Carolina towns, and the utility law set a legal deadline for power companies to cut emissions instead of leaving it voluntary.',c:'Faced backlash for long COVID lockdown orders that critics say hurt small businesses and learning. Vetoed income tax cuts and school voucher expansion.',p:'Raise teacher pay, invest in federal child care, codify reproductive rights.',y:'For a young middle-class married couple planning a family, his push for federal child care help and maternal health protections could ease some of the biggest early costs, such as delivery and child care. The tradeoff critics raise is that large federal spending could keep inflation and interest rates high, which would make groceries pricier and a first mortgage harder to afford on two middle-class incomes.'}],
['Michael Whatley','Republican',{b:'Has never held elected office. Chief of Staff to Sen. Elizabeth Dole, Deputy Assistant Secretary of Energy under Bush, and over a decade lobbying for oil and gas. His career has been almost entirely behind the scenes: running a senator’s office and constituent services, helping shape energy policy inside a federal department, and then advocating for oil and gas producers in Washington, so voters have a résumé to weigh but no voting record to check.',c:'Critics say his lobbying served corporations, not energy bills. Drew backlash for backing past state Medicaid cuts, and as GOP chair focused on 2020 election irregularities and defending January 6th participants.',p:'No federal tax on tips, overtime or Social Security, steep tariffs, mass deportations, end cashless bail.',y:'If either spouse in a young middle-class married couple works hourly or overtime shifts, ending federal tax on overtime and tips could noticeably raise their combined take-home pay, and more domestic energy is meant to lower gas and utility bills. On the other side, steep tariffs could raise what such a couple pays for imported goods, electronics and vehicles, which matters when they are furnishing a first home or shopping for a car.'}],
['Shannon W. Bray','Libertarian',{b:'No government record. Navy veteran, technology and cybersecurity consultant, and kept Libertarian ballot access alive in North Carolina. Years in cybersecurity mean he has spent his career protecting systems and data for clients, and keeping the party on the ballot gives voters a third option, though none of it involved writing laws or managing public money.',c:'Untested with public budgets. Seeks to cut or abolish federal programs many rely on and to deregulate sharply, including AI and environmental rules.',p:'Digital privacy first, audit all unclassified federal spending, protect crypto, remove federal involvement in local education.',y:'Stronger digital privacy and fewer rules on crypto could better protect a young middle-class married couple’s personal data and any digital investments they hold. But his goal of dismantling federal agencies could end the first-time homebuyer programs, student loan management and infrastructure grants that a young middle-class married couple often leans on while buying a home and paying down debt.'}],
['Michael Dublin','Green',{b:'Has never held office. Marine Corps veteran, 25 years as an NC public school teacher, and organizes campaigns that refuse corporate PAC money. Twenty-five years in a classroom gives him a close view of school funding and teacher pay, and his campaigns have been grassroots efforts built around turning down corporate money.',c:'No governance experience. A $25 federal minimum wage and an oil drilling ban are seen as an economic shock, and abolishing NATO and defunding the military are highly controversial.',p:'Green New Deal, Medicare for All, 12 months of paid parental leave, shift military funding to housing and healthcare.',y:'Medicare for All and 12 months of paid parental leave would be major relief if either spouse in a young middle-class married couple faces a medical emergency or the couple starts a family, since insurance and time off are two of the biggest worries for newly married households. Critics warn that a $25 minimum wage and energy bans could push up everyday costs and make private-sector jobs less stable, which could hit a two-income household.'}]]},
{t:'U.S. House District 12',v:'Vote for 1',i:[
['Alma S. Adams','Democrat, incumbent',{b:'In Congress since 2014. Wrote the FUTURE Act ($255 million a year for Minority-Serving Institutions), co-founded the Black Maternal Health Caucus, and secured federal grants for local food banks. The FUTURE Act money supports colleges that serve many first-generation and Black students, the maternal health caucus works on closing racial gaps in childbirth outcomes, and the food bank grants help local families facing hunger.',c:'Votes almost entirely along national party lines. Critics tie her support for large federal spending to inflation and say her long tenure blocks new leadership.',p:'Codify reproductive rights, expand maternal healthcare, more affordable housing subsidies, stronger union protections.',y:'Her push for housing subsidies and stronger union protections could help a young middle-class married couple in Charlotte find affordable housing and win better wages and benefits. Fiscal conservatives counter that her votes for large federal spending add to the inflation that raises the cost of groceries, gas and rent for a household like theirs.'}],
['Jack Codiga','Republican',{b:'No government record. Works in commercial real estate finance in Charlotte and moved here in 2021 to build his career and campaign. Financing commercial real estate deals has given him a banker’s view of interest rates and the money supply, which is what shaped his ideas about the Federal Reserve, though he has never written or voted on a law.',c:'Abolishing the Federal Reserve is seen as a fringe idea that could destabilize banking. Removing liability protections for vaccine makers drew pushback, and his strict anti-abortion stance alienates moderates.',p:'Abolish the Fed, ban property taxes nationwide, heavily restrict federal welfare, strictly limit local zoning.',y:'Relaxing local zoning rules could let builders put up more homes, which could lower prices for a young middle-class married couple saving for a first house. But abolishing the Federal Reserve could bring sharp swings in the economy, threatening such a couple’s 401(k), savings and the mortgage rate they would lock in, and heavy cuts to federal welfare programs would leave less of a safety net if either spouse lost a job.'}]]},
{t:'NC Senate District 40',v:'Vote for 1',i:[
['Joyce Waddell','Democrat, incumbent',{b:'Serving since 2015. Introduced a ban on utility shutoffs in extreme weather, bills to restore longevity pay for teachers, and the Living Wage Guarantee Act. The shutoff ban would keep heat and power on during heat waves and freezes, the longevity pay bills would reward teachers for staying in the classroom, and the minimum wage bill would raise pay at the bottom of the scale, although as a member of the minority party she has often seen such bills stall.',c:'In the minority, her major bills rarely pass. Critics target her opposition to school vouchers and to income tax rate cuts.',p:'More public school funding, higher teacher pay, maternal health regulation, property tax breaks for seniors.',y:'Stronger public school funding and better teacher pay help neighborhood schools and support home values, which matters to a young middle-class married couple planning to stay in Charlotte and raise children there. Her opposition to income tax cuts means a couple like this would keep paying a higher share of income to the state than under a Republican plan, and her property tax breaks are aimed at seniors, not young households.'}],
['Bobbie Shields','Republican',{b:'Never held elected office, but spent 27 years in appointed Mecklenburg County roles, including interim County Manager. Licensed engineer and small business owner. Twenty-seven years inside county government means he knows how budgets, staffing and public works actually run, and his time as an engineer overseeing public works is why he leans toward roads and infrastructure, though it was all administration rather than writing or voting on laws.',c:'Opponents say school choice strips funding from struggling public schools, limiting state spending could cut safety nets, and managing is not the same as legislating.',p:'More school choice, free-market job growth, more spending on infrastructure, limits on state spending.',y:'Cutting state taxes and limiting state spending would leave more in a young middle-class married couple’s two paychecks each month, and his engineering background could mean faster fixes to the roads on their commute. But expanding school vouchers could pull state resources away from neighborhood public schools, which matters if the couple plans to send children to one, and limits on spending could trim safety-net programs they might need in a hard year.'}]]},
{t:'NC House District 112',v:'Vote for 1',i:[
['Jordan Lopez','Democrat, unopposed',{b:'No prior lawmaking record. Former policy analyst in the Governor’s office and East Charlotte community organizer who cleared the field. Working inside the governor’s office taught him how policy is drafted and budgeted, and his organizing in East Charlotte rooted him in the neighborhood he hopes to represent, though he has not yet cast a vote as a lawmaker.',c:'Voters in the district get no competitive choice. Fiscal conservatives say his state mandates mean tax increases, and he lacks seniority to move a progressive agenda.',p:'Free school lunch, statewide paid family and sick leave, incremental housing, more mental health funding.',y:'A statewide paid family and sick leave rule would let either spouse in a young middle-class married couple take time off for a new baby or an illness without losing a paycheck or a job, and free school lunch would trim costs once they have children in school. Critics argue those mandates carry a price that eventually lands on households like theirs through higher local taxes and costs for local services.'}]]}]},
{id:'amendments',h:155,t:'Constitutional amendments',s:'Three changes to the state constitution',n:'A passed amendment locks a rule into North Carolina’s highest law, where future legislatures cannot quietly repeal it.',g:[{t:'Statewide',v:'Vote for or against each',i:[
['Voter photo ID','Amendment 1',{q:'A yes vote makes ID rules unchangeable by future legislatures. A no vote keeps current ID laws but lets future politicians modify them.',u:'All voters, including mail-in, must show photo identification.',n:'Keeps the status quo. Critics of the amendment say locking it in could shut out homebound seniors or disabled citizens if ID rules become too strict.'}],
['Income tax cap at 3.5%','Amendment 2',{q:'Permanently restricts the state’s taxing authority.',u:'Lowers the maximum income tax rate from 7% to 3.5% and guarantees the state cannot raise it above that.',n:'Keeps emergency flexibility. Critics say capping revenue could force deep cuts to schools and universities in a recession, or much higher sales taxes.'}],
['Local property tax limits','Amendment 3',{q:'Shifts power from local counties to the state legislature.',u:'Gives homeowners a constitutional safeguard against steep tax jumps when home values rise.',n:'Leaves decisions with locally elected commissioners. With no exact number set, critics say Raleigh could cripple fast-growing counties like Mecklenburg from funding police, fire and school growth.'}]]}]},
{id:'courts',h:265,t:'Appeals court races',s:'Three Court of Appeals seats',n:'Statewide judicial races. Each seat pairs a Republican and a Democrat.',g:[
{t:'Court of Appeals, Seat 1',v:'Vote for 1',i:[
['Michael C. Byrne','Republican',{b:'30-year litigator and administrative law judge, heavily backed by police unions.',c:'No appellate bench experience.',f:'Strict judicial restraint and plain-text interpretation.'}],
['John S. Arrowood','Democrat, incumbent',{b:'11 years on the appellate bench with hundreds of binding opinions, plus Superior Court trial experience.',c:'Conservatives say his rulings are too flexible and not strictly originalist.',f:'Judicial independence and keeping partisan politics out of rulings.'}]]},
{t:'Court of Appeals, Seat 2',v:'Vote for 1',i:[
['George Cooper Bell','Republican',{b:'Superior Court judge with 100+ felony jury trials, running on law and order.',c:'A public judicial reprimand in 2019 and no appellate experience.',f:'Strict constitutional constructionist focused on victims’ rights.'}],
['Tobias Hampson','Democrat, incumbent',{b:'Board Certified Specialist in Appellate Practice, on the appeals court since 2019.',c:'Lacks his opponent’s tough-on-crime trial sentencing experience.',f:'Predictable, practical application of the law over pure originalism.'}]]},
{t:'Court of Appeals, Seat 3',v:'Vote for 1',i:[
['Craig Collins','Republican',{b:'Prosecutor, District Judge and Superior Court Judge who cleared high-volume trial dockets.',c:'No appellate experience and fewer years on the bench than his opponent.',f:'Protect constitutional rights and keep personal politics off the bench.'}],
['Christine Marie Walczyk','Democrat',{b:'19-year District Court judge handling complex family and civil disputes.',c:'Career limited to District Court, so fewer major felonies, and no appellate experience.',f:'Depoliticize the judiciary and restore bipartisan balance.'}]]}]},
{id:'county',h:38,t:'County offices',s:'Seven offices, all unopposed',n:'Every candidate here is running unopposed in November.',g:[{t:'Mecklenburg County',v:'Vote for 1 per office',i:[
['Spencer Merriweather','Democrat, District Attorney',{a:'Restructured the office to prioritize violent felonies and homicides, with diversion programs for first-time nonviolent offenders.',c:'Tough-on-crime advocates say he ignores property theft, while progressives say his cash bail policies still harm low-income residents.',y:'A district attorney focused on violent crime shapes how safe a young middle-class married couple’s neighborhood feels day to day, and diversion programs aim to give first-time nonviolent offenders a way to avoid a lasting record. Residents worried about property theft are the ones who say it gets too little attention.'}],
['Leigh Altman','Democrat, Commissioner At-Large',{a:'Top vote-getter who presses on county budgets to fund mental health and affordable housing.',c:'Fiscal conservatives criticize her support for recent property tax increases, and her questioning often clashes with other officials.',y:'Her push for mental health funding and affordable housing could mean more local help if a family member struggles or a young middle-class married couple is hunting for a first home. But the property tax increases she backed show up on a homeowner’s bill, so the same budget decisions that fund those services can raise what a couple pays each year.'}],
['Yvette Townsend-Ingram','Democrat, Commissioner At-Large',{a:'Directs county resources toward closing economic disparities, workforce training and minority-owned businesses.',c:'Held responsible for property tax increases that add to the cost of living, and has less seniority than other members.',y:'Her focus on workforce training and minority-owned businesses aims to create better local jobs and openings for people building careers. The property tax increases critics tie to her can reach homeowners directly and can filter into rents, which a young middle-class married couple weighing a first purchase should keep in mind.'}],
['Arthur Griffin, Jr.','Democrat, Commissioner At-Large',{a:'Former CMS Board Chair who demands academic accountability for how the county funds public schools.',c:'His tough oversight has caused friction with the school board, and he supports high tax levels that fiscal conservatives oppose.',y:'His demand for academic results matters to a young middle-class married couple planning to enroll children in public schools, since he presses to make sure county school money produces results. The cost is the high tax levels fiscal conservatives oppose, along with friction with the school board that can slow cooperation.'}],
['George Dunlap','Democrat, Commissioner District 3',{a:'Veteran board chairman driving investment in parks, recreation and corporate economic development.',c:'Takes the blame for unpopular tax hikes, and critics say 18 years in office has led to stagnation.',y:'Investment in parks, recreation and economic development shapes the everyday amenities of the county and the kinds of employers moving in, which touches both a young middle-class married couple’s free time and job options. The flip side is the tax hikes critics hold him responsible for, which flow into a homeowner’s yearly property tax bill.'}],
['Elisa Chinn Gary','Democrat, Clerk of Superior Court',{a:'Runs the state’s busiest courthouse operations and programs that help families with estates and probate.',c:'Presided over the delayed, bottlenecked statewide shift to digital filing (eCourts).',y:'The clerk’s office is where families handle estates and probate, so her programs could help a young middle-class married couple managing a relative’s estate or filing court papers. The slow move to digital filing is the frustration critics point to, which can mean delays when a couple needs a document handled.'}],
['Garry L. McFadden','Democrat, Sheriff',{a:'Ended cooperation with ICE on deportations and built vocational training programs for jail inmates.',c:'Faces scrutiny from state inspectors over jail staffing shortages, safety crises and inmate deaths.',y:'The sheriff matters to a young middle-class married couple mostly through public safety and how well tax dollars are used, since he runs the jail and sets how the county works with federal immigration authorities. His vocational programs aim to send people home ready for work, while staffing and safety problems inside the jail are the major criticism.'}]]}]},
{id:'local',h:340,t:'Conservation and city bonds',s:'A small board and three city bonds',g:[
{t:'Soil and Water Conservation',v:'Choose 2',note:'A real but limited decision. This nonpartisan board handles farm preservation, polluted urban runoff and erosion.',i:[
['Barbara Bleiweis','Active choice',{b:'Two-term incumbent who makes heavy use of state grants.'}],
['Michael Betterly','Active choice',{b:'Private-sector horticulture professional focused on urban tree canopies.'}],
['Makenzie Pearce','Little information',{b:'A grassroots option, but with no published website or detailed plans.'}],
['Long Tran','Little information',{b:'A grassroots option, but with no published website or detailed plans.'}],
['Jillian King','Campaign suspended',{b:'Still on the ballot but has suspended her campaign, so a vote for her is a wasted choice.'}]]},
{t:'City of Charlotte bonds',v:'Vote yes or no on each',note:'The city cannot borrow hundreds of millions without voter approval. Taxes are not expected to rise now, but a yes vote pledges your future property taxes as a backup if city revenue falls short.',i:[
['Transportation bonds','$280M, or $437.1M with interest',{u:'Quickly funds street resurfacing, sidewalks and intersection upgrades for a fast-growing city.',n:'Avoids almost half a billion dollars of long-term debt for street projects that notoriously take years.'}],
['Housing bonds','$125M, or $198.4M with interest',{u:'Subsidizes private developers to build and preserve affordable apartments during the housing crisis.',n:'Blocks the debt. Critics say the subsidies still leave housing too costly for the lowest-income workers and miss root causes like zoning.'}],
['Neighborhood Improvement Bonds','$20M, or $31.2M with interest',{u:'Funds sidewalk, storm drainage and lighting upgrades in older, underserved neighborhoods.',n:'Blocks borrowing on the argument that routine upkeep like paving belongs in the yearly budget, not 20-year loans with heavy interest.'}]]}]}
];
const app=document.getElementById('app');
const det=o=>Object.keys(o).map(k=>`<p><b>${L[k]}</b>${o[k]}</p>`).join('');
const item=x=>`<div class="it"><button data-t aria-expanded="false"><span><span class="nm">${x[0]}</span><span class="tg">${x[1]}</span></span><i class="i"></i></button><div class="pn"><div>${det(x[2])}</div></div></div>`;
const home=()=>`<h1>Mecklenburg County voter guide</h1><p class="lede">General election, November 3, 2026. A neutral look at who and what is on your ballot.</p><nav class="nav">${P.map(p=>`<a class="row" href="#${p.id}" style="--h:${p.h}"><i class="dot"></i><span><span class="nm">${p.t}</span><small>${p.s}</small></span></a>`).join('')}</nav><p class="foot">Condensed from a bipartisan guide. Confirm details on your official sample ballot.</p>`;
const part=(p,i)=>{const n=P[i+1];return `<a class="back" href="#">All sections</a><h2>${p.t}</h2>${p.n?`<p class="lede">${p.n}</p>`:''}${p.g.map(g=>`<section class="gp"><h3>${g.t}</h3><p class="gv">${g.v||''}</p>${g.note?`<p class="note">${g.note}</p>`:''}${g.i.map(item).join('')}</section>`).join('')}<a class="next" href="#${n?n.id:''}">${n?'Next<span class="nm">'+n.t+'</span>':'<span class="nm">Back to the start</span>'}</a>`};
function render(){const i=P.findIndex(p=>p.id===location.hash.slice(1));document.documentElement.style.setProperty('--h',i<0?110:P[i].h);app.innerHTML=i<0?home():part(P[i],i);document.title=i<0?'Mecklenburg County Voter Guide':P[i].t;window.scrollTo(0,0)}
app.addEventListener('click',e=>{const b=e.target.closest('button[data-t]');if(b){const o=b.parentElement.classList.toggle('open');b.setAttribute('aria-expanded',o)}});
addEventListener('hashchange',render);render();
</script>
</body>
</html>
